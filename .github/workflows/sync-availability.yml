name: Dream Room availability sync

on:
  push:
    branches: [main]
    paths:
      - "availability/**"
      - ".github/workflows/sync-availability.yml"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dream-room-availability-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install calendar parsers
        run: python -m pip install -r availability/requirements.txt
      - name: Run calendar parser tests
        run: python -m unittest discover -s availability -p 'test_*.py' -v
      - name: Fetch and sanitize BAND calendar
        env:
          DREAM_ROOM_BAND_ICAL_URL: ${{ secrets.DREAM_ROOM_BAND_ICAL_URL }}
        run: |
          if [ -z "$DREAM_ROOM_BAND_ICAL_URL" ]; then
            echo "::notice title=Availability not configured::Add the DREAM_ROOM_BAND_ICAL_URL repository secret to activate the checker."
            exit 0
          fi
          python availability/sync.py
      - name: Publish anonymous availability to status issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python availability/publish_issue.py
